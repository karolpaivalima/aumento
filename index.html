<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aumento</title>
    <script src="script.js" defer></script>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            text-align: center;
        }

        div {
            margin-bottom: 10px;
        }

        input {
            width: 150px;
            margin: 10px;
            padding: 8px 2px;
            font-size: 16px;

            border: none;
            border-bottom: 1px solid black;
            outline: none;
        }

        input::-webkit-inner-spin-button {
            display: none;
        }

        label {
            font-weight: 700;
        }

        button {
            padding: 10px 15px;
            margin-bottom: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div>
        <label for="salario">Digite o salário da pessoa:</label>
        <input type="number" id="salario" placeholder="Digite aqui">
    </div>

    <div>
        <label for="novo-salario">Novo salário =</label>
        <input type="number" id="novo-salario" placeholder="Digite aqui">
    </div>

    <!--<div>
        <label for="aumento">Aumento = </label>
        <input type="number" id="aumento" placeholder="Digite aqui">
    </div>

    <div>
        <label for="novo-salario">Porcentagem = </label>
        <input type="number" id="novo-salario" placeholder="Digite aqui">-->
    </div>

    <button>Calcular</button>

    <p id="resultado"></p>
</body>

</html>
